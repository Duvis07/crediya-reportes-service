server:
  port: ${SERVER_PORT:8082}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

spring:
  application:
    name: reportes-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  devtools:
    add-properties: false
    restart:
      enabled: false

logging:
  level:
    co.com.crediya.reportes: DEBUG
    software.amazon.awssdk: INFO
    org.springframework: INFO
    io.awspring.cloud: DEBUG

# AWS LocalStack Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  localstack:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}

# DynamoDB Configuration
dynamodb:
  endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
  table:
    loan-reports: ${DYNAMODB_TABLE_LOAN_REPORTS:loan-reports}

# SQS Configuration
sqs:
  endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
  queues:
    loan-approved-events: ${AWS_SQS_QUEUES_LOAN_APPROVED_EVENTS:loan-approved-events-queue}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
