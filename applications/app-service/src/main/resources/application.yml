server:
  port: ${SERVER_PORT:8082}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

spring:
  application:
    name: reportes-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  devtools:
    add-properties: false
    restart:
      enabled: false

logging:
  level:
    co.com.crediya.reportes: DEBUG
    software.amazon.awssdk: INFO
    org.springframework: INFO
    io.awspring.cloud: INFO

# AWS LocalStack Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  localstack:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}

# DynamoDB Configuration
dynamodb:
  endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
  table:
    loan-reports: ${DYNAMODB_TABLE_LOAN_REPORTS:loan-reports}

# SQS Configuration
sqs:
  endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
  queues:
    loan-approved-events: ${AWS_SQS_QUEUES_LOAN_APPROVED_EVENTS:loan-approved-events-queue}

# Email Configuration (MailHog)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:crediya@localhost}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  # Scheduling Configuration
  task:
    scheduling:
      enabled: true

# Application Configuration
app:
  admin:
    emails: ${ADMIN_EMAILS:admin@crediya.com,gerente@crediya.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
