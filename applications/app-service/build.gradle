apply plugin: 'org.springframework.boot'

dependencies {
    // --- Módulos internos ---
    implementation project(':model')
    implementation project(':usecase')
    implementation project(':dynamo-db')
    implementation project(':reactive-web')
    implementation project(':sqs-sender')
    implementation project(':email-sender')
    implementation project(':scheduled-tasks')
    implementation project(':metrics')

    // --- Librerías externas ---
    implementation 'org.reactivecommons.utils:object-mapper:0.1.0'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // --- AWS SDK para LocalStack ---
    implementation platform('software.amazon.awssdk:bom:2.20.162')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:ses'

    // --- Herramientas de desarrollo ---
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // --- Dependencias para pruebas ---
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    // To disable the *-plain.jar
    enabled = false
}

bootJar {
    // Sets output jar name
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}

// Task to copy JAR to deployment directory
tasks.register('copyJarToDeployment', Copy) {
    dependsOn bootJar
    from bootJar.archiveFile
    into "${project.getParent().projectDir}/deployment"
    doLast {
        println "JAR copied to deployment directory: ${project.getParent().projectDir}/deployment/${bootJar.archiveFileName.get()}"
    }
}

// Make build depend on copyJarToDeployment
build.dependsOn copyJarToDeployment