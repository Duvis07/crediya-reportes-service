version: '3.8'

services:

  # Reportes Service
  reportes-service:
    build:
      context: ./deployment
      dockerfile: Dockerfile
    container_name: crediya-reportes-service
    environment:
      # Server Configuration
      SERVER_PORT: 8082
      
      # JWT Configuration
      JWT_SECRET: mySecretKeyForCrediyaAuthenticationServiceThatIsLongEnoughForHS256
      JWT_JWK_SET_URI: http://authentication-service:8080/.well-known/jwks.json
      JWT_ISSUER_URI: http://authentication-service:8080
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://authentication-service:8080,http://solicitudes-service:8081,http://reportes-service:8082
      
      # AWS/LocalStack Configuration (usando LocalStack compartido de solicitudes)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DYNAMODB_ENDPOINT: http://localstack:4566
      AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_SQS_QUEUES_LOAN_APPROVED_EVENTS: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/loan-approved-events-queue
      
      # Email Configuration (usando MailHog compartido de solicitudes)
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: 
      SPRING_MAIL_PASSWORD: 
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false
      
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: docker
      
      # Logging
#      LOGGING_LEVEL_ROOT: INFO
#      LOGGING_LEVEL_CO_COM_CREDIYA: DEBUG
      
    ports:
      - "8082:8082"
    depends_on: []
    networks:
      - crediya-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

networks:
  crediya-network:
    external: true
    name: crediya-network

volumes:
  localstack_reportes_data:
    driver: local
